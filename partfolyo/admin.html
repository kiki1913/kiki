<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-area" style="max-width: 350px; margin: 100px auto; text-align: center;">
        <h2>Admin Kirish</h2>
        <input type="text" id="user" placeholder="Login">
        <input type="password" id="pass" placeholder="Parol">
        <button class="btn-main" onclick="login()">Kirish</button>
    </div>

    <div id="admin-content" style="display: none;" class="admin-container">
        <h1>Dashboard</h1>
        
        <div class="admin-card">
            <h3>Profil Tahriri</h3>
            <input type="text" id="inp-name" placeholder="Ismingiz">
            <input type="text" id="inp-job" placeholder="Kasbingiz">
            <textarea id="inp-bio" placeholder="Bio"></textarea>
            <input type="file" id="inp-img-file">
            <button class="btn-main" onclick="saveProfile()">Profilni Yangilash</button>
        </div>

        <div class="admin-card">
            <h3>Yangi Ilova Qo'shish</h3>
            <input type="text" id="app-name" placeholder="Nomi">
            <input type="text" id="app-link" placeholder="Link">
            <textarea id="app-desc" placeholder="Tavsif"></textarea>
            <label>Logotip:</label><input type="file" id="app-logo-file">
            <label>Screenshots:</label><input type="file" id="app-imgs-file" multiple>
            <button class="btn-main" onclick="addApp()">Dasturni Saqlash</button>
        </div>

        <h3>Loyihalar va Analitika</h3>
        <div id="admin-app-list"></div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <h3>Tahrirlash</h3>
            <input type="hidden" id="edit-id">
            <input type="text" id="edit-name">
            <textarea id="edit-desc"></textarea>
            <input type="text" id="edit-link">
            <button class="btn-main" onclick="saveEdit()">Saqlash</button>
            <button class="btn-main" onclick="document.getElementById('editModal').style.display='none'" style="background:#333; margin-top:5px;">Yopish</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
